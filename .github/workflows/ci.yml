name: CREDVAIL CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    name: TypeScript, Unit Tests, Phase Suites & Security Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      KMS_MASTER_KEY: "zlWXisXpyUfdlbhE31iIHkuRx6gmTt0I6WIIaFffrE8="
      SESSION_SECRET: "ci_test_only_session_secret_minimum_32_bytes_key"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies deterministically
        run: npm ci

      - name: Validate Prisma schema & generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run full Vitest unit test suite
        run: npx vitest run test/unit --reporter=verbose --reporter=json --outputFile=vitest-unit-report.json

      - name: Run non-PostgreSQL integration suites
        run: npx vitest run test/integration --exclude "test/integration/postgres-*.test.ts"

      - name: Run Phase 0-13 verification scripts
        run: npm test

      - name: Dependency vulnerability check
        run: npm audit --audit-level=critical

      - name: Verify no tracked secrets in repository
        run: |
          if git ls-files .env | grep -q ".env"; then
            echo "FATAL: .env must never be tracked in Git."
            exit 1
          fi
          if git grep -n "NEXT_PUBLIC_KMS_MASTER_KEY" src/; then
            echo "FATAL: KMS_MASTER_KEY must never have a NEXT_PUBLIC_ prefix."
            exit 1
          fi

      - name: Upload unit test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit-report
          path: vitest-unit-report.json
          if-no-files-found: ignore

  postgres-integration:
    name: Live PostgreSQL 16 Integration & Migration Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credvail_ci
          POSTGRES_PASSWORD: credvail_ci_password_2026
          POSTGRES_DB: credvail_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credvail_ci -d credvail_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://credvail_ci:credvail_ci_password_2026@localhost:5432/credvail_ci_db?schema=public"
      PG_DSN: "postgresql://credvail_ci:credvail_ci_password_2026@localhost:5432/credvail_ci_db"
      REQUIRE_POSTGRES_INTEGRATION: "true"
      NODE_ENV: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & push schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Apply PostgreSQL single-owner index & triggers
        run: |
          psql -v ON_ERROR_STOP=1 "$PG_DSN" -f prisma/sql/h1-3-3-data-integrity-check.sql
          psql -v ON_ERROR_STOP=1 "$PG_DSN" -f prisma/sql/h1-3-3-single-owner-index.sql
          psql -v ON_ERROR_STOP=1 "$PG_DSN" -f prisma/sql/h1-3-3-ownership-monotonicity-trigger.sql

      - name: Run all PostgreSQL integration suites (including KMS migration)
        run: |
          npx vitest run \
            test/integration/postgres-claim-concurrency.test.ts \
            test/integration/postgres-h13-resilience.test.ts \
            test/integration/postgres-claim-rate-limiter.test.ts \
            test/integration/postgres-wallet-ownership.test.ts \
            test/integration/postgres-kms-migration.test.ts \
            --no-file-parallelism \
            --reporter=verbose \
            --reporter=json \
            --outputFile=vitest-pg-report.json

      - name: Upload PostgreSQL test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-pg-report
          path: vitest-pg-report.json
          if-no-files-found: ignore

  production-build:
    name: Next.js Production Build Verification
    runs-on: ubuntu-latest
    needs: [quality-and-unit]
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & build production app
        run: |
          npx prisma generate
          npm run build
