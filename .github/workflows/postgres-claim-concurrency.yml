name: PostgreSQL Concurrency & Transaction Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency-tests:
    name: PostgreSQL Live Concurrency & Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credvail_user
          POSTGRES_PASSWORD: credvail_ci_password_2026
          POSTGRES_DB: credvail_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credvail_user -d credvail_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://credvail_user:credvail_ci_password_2026@localhost:5432/credvail_test_db?schema=public"
      REQUIRE_POSTGRES_INTEGRATION: "true"
      NODE_ENV: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Synchronize PostgreSQL Schema
        run: npx prisma db push --skip-generate

      - name: Execute Live PostgreSQL Concurrency & Transaction Integrity Tests
        run: npx vitest run test/integration/postgres-claim-concurrency.test.ts test/integration/postgres-h13-resilience.test.ts --reporter=verbose --reporter=json --outputFile=vitest-report.json

      - name: Publish Test Execution Summary
        if: always()
        run: |
          echo "## PostgreSQL Concurrency & Challenge Resilience CI Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PostgreSQL Engine**: \`postgres:16-alpine\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Enforcement Flag**: \`REQUIRE_POSTGRES_INTEGRATION=true\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version**: 22" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Targets**: \`test/integration/postgres-claim-concurrency.test.ts\`, \`test/integration/postgres-h13-resilience.test.ts\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f vitest-report.json ]; then
            PASSED=$(node -e "const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numPassedTests || 0);")
            FAILED=$(node -e "const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numFailedTests || 0);")
            SKIPPED=$(node -e "const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numPendingTests || 0);")
            TOTAL=$(node -e "const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numTotalTests || 0);")
            echo "### Dynamic Test Execution Metrics" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Tests**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- **Skipped**: $SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Test Matrix & Adversarial Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "#### Claim Concurrency & Integrity (PG-01 to PG-10)" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-01 to PG-03**: Concurrent simultaneous claims -> exactly 1 succeeds, others fail with typed CLAIM_ALREADY_CONSUMED" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-04**: Expired invitation consumption -> strictly rejected with typed CLAIM_EXPIRED" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-05**: Replay of consumed invitation -> strictly rejected with typed CLAIM_ALREADY_CONSUMED (HTTP 410)" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-06**: Downstream association failure -> full atomic rollback verified, zero audit logs committed" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-07**: Successful claim -> atomic association with recipient, user, holder DID, and audit log" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-08**: Mismatched token hash -> rejected with typed CLAIM_INVALID" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-09**: Claim API route integration -> losing redemption returns HTTP 410 GONE, never HTTP 500" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-10**: Retry exhaustion -> bounded conflict exhaustion returns controlled HTTP 503 with Retry-After header" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Challenge Nonce Persistence & Replay Protection (H131-01 to H131-16)" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-01 / H131-02**: Raw nonce returned once; only SHA-256 nonceHash stored in PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-03 / H131-04**: Survives process restart; multiple application instances read same challenge" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-05 / H131-06**: Validated against verifier audience; mismatched audience rejected without consuming" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-07 / H131-08**: Expired or unknown challenges strictly rejected" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-09 / H131-10**: Invalid holder signature leaves challenge unconsumed; valid signature consumes atomically" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-11**: Replay of consumed challenge strictly rejected" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-12 / H131-13**: Concurrent consumers -> exactly 1 succeeds, others fail atomically" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-14**: Cross-instance consumption rejection verified" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-15**: Fail-closed reachability verification enforced" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-16**: Bounded expired challenge cleanup removes expired rows while strictly preserving active challenges" >> $GITHUB_STEP_SUMMARY
