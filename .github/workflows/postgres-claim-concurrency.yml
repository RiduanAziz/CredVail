name: PostgreSQL Concurrency & Transaction Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-concurrency-tests:
    name: PostgreSQL Live Concurrency & Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credvail_user
          POSTGRES_PASSWORD: credvail_ci_password_2026
          POSTGRES_DB: credvail_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credvail_user -d credvail_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://credvail_user:credvail_ci_password_2026@localhost:5432/credvail_test_db?schema=public"
      REQUIRE_POSTGRES_INTEGRATION: "true"
      NODE_ENV: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Synchronize PostgreSQL Schema
        run: npx prisma db push --skip-generate

      - name: Pre-Index Data Integrity Diagnostic
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f prisma/sql/h1-3-3-data-integrity-check.sql

      - name: Apply Single-Owner Partial Unique Index
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f prisma/sql/h1-3-3-single-owner-index.sql

      - name: Verify Single-Owner Partial Unique Index Definition and Validity
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f prisma/sql/h1-3-3-verify-single-owner-index.sql

      - name: Execute Live PostgreSQL Concurrency & Transaction Integrity Tests
        run: |
          npx vitest run \
            test/integration/postgres-claim-concurrency.test.ts \
            test/integration/postgres-h13-resilience.test.ts \
            test/integration/postgres-claim-rate-limiter.test.ts \
            test/integration/postgres-wallet-ownership.test.ts \
            --reporter=verbose \
            --reporter=json \
            --outputFile=vitest-report.json

      - name: Publish Test Execution Summary
        if: always()
        run: |
          echo "## PostgreSQL Concurrency, Replay Resilience & Rate Limiting CI Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Result**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PostgreSQL Engine**: \`postgres:16-alpine\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Enforcement Flag**: \`REQUIRE_POSTGRES_INTEGRATION=true\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version**: 22" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Targets**: \`test/integration/postgres-claim-concurrency.test.ts\`, \`test/integration/postgres-h13-resilience.test.ts\`, \`test/integration/postgres-claim-rate-limiter.test.ts\`, \`test/integration/postgres-wallet-ownership.test.ts\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f vitest-report.json ]; then
            PASSED=$(node -e "try { const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numPassedTests ?? -1); } catch { console.log(-1); }")
            FAILED=$(node -e "try { const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numFailedTests ?? -1); } catch { console.log(-1); }")
            SKIPPED=$(node -e "try { const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numPendingTests ?? -1); } catch { console.log(-1); }")
            TOTAL=$(node -e "try { const r = JSON.parse(require('fs').readFileSync('vitest-report.json')); console.log(r.numTotalTests ?? -1); } catch { console.log(-1); }")
            echo "### Dynamic Test Execution Metrics" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Tests**: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- **Failed**: $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- **Skipped**: $SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Strictly enforce: numTotalTests === 50, numPassedTests === 50, numFailedTests === 0, numPendingTests === 0
            if [ "$TOTAL" -ne 50 ] || [ "$PASSED" -ne 50 ] || [ "$FAILED" -ne 0 ] || [ "$SKIPPED" -ne 0 ]; then
              echo "❌ CI Verification Gate Failed: Expected exactly 50 passed tests with 0 failed and 0 skipped." >> $GITHUB_STEP_SUMMARY
              echo "Got: Total=$TOTAL, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED"
              exit 1
            fi
          else
            echo "❌ CI Verification Gate Failed: vitest-report.json was not generated." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### Test Matrix & Adversarial Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "#### Claim Concurrency & Integrity (PG-01 to PG-10)" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-01 to PG-03**: Concurrent simultaneous claims -> exactly 1 succeeds, others fail with typed CLAIM_ALREADY_CONSUMED" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-04**: Expired invitation consumption -> strictly rejected with typed CLAIM_EXPIRED" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-05**: Replay of consumed invitation -> strictly rejected with typed CLAIM_ALREADY_CONSUMED (HTTP 410)" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-06**: Downstream association failure -> full atomic rollback verified, zero audit logs committed" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-07**: Successful claim -> atomic association with recipient, user, holder DID, and audit log" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-08**: Mismatched token hash -> rejected with typed CLAIM_INVALID" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-09**: Claim API route integration -> losing redemption returns HTTP 410 GONE, never HTTP 500" >> $GITHUB_STEP_SUMMARY
          echo "- **PG-10**: Retry exhaustion -> bounded conflict exhaustion returns controlled HTTP 503 with Retry-After header" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Challenge Nonce Persistence & Replay Protection (H131-01 to H131-16)" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-01 / H131-02**: Raw nonce returned once; only SHA-256 nonceHash stored in PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-03 / H131-04**: Survives process restart; multiple application instances read same challenge" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-05 / H131-06**: Validated against verifier audience; mismatched audience rejected without consuming" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-07 / H131-08**: Expired or unknown challenges strictly rejected" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-09 / H131-10**: Invalid holder signature leaves challenge unconsumed; valid signature consumes atomically" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-11**: Replay of consumed challenge strictly rejected" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-12 / H131-13**: Concurrent consumers -> exactly 1 succeeds, others fail atomically" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-14**: Cross-instance consumption rejection verified" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-15**: Mandatory integration precondition verified (live PostgreSQL active, no in-memory fallback)" >> $GITHUB_STEP_SUMMARY
          echo "- **H131-16**: Bounded expired challenge cleanup removes expired rows while strictly preserving active challenges" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Distributed PostgreSQL Rate Limiting & Abuse Protection (PGRL-01 to PGRL-12)" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-01 / PGRL-02**: 10 attempts in 60s window allowed; 11th attempt strictly rejected with HTTP 429 and Retry-After" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-03**: Window expiry resets counter and allows fresh attempt cycle" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-04**: Isolated rate-limit buckets per authenticated user" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-05**: 20 simultaneous concurrent attempts across independent application instances produce exactly 10 allowed and 10 rejected" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-06**: Multi-instance cluster sharing via PostgreSQL row-level locks without process-local state" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-07**: Zero raw user identifiers stored; only domain-separated SHA-256 pseudonymous key persisted" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-08**: Bounded stale cleanup deletes expired buckets while strictly preserving active buckets" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-09 / PGRL-10**: HTTP 429 headers and HTTP 503 fail-closed typed CLAIM_RATE_LIMIT_UNAVAILABLE verified" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-11**: X-Forwarded-For and IP spoofing cannot bypass authenticated session bucket" >> $GITHUB_STEP_SUMMARY
          echo "- **PGRL-12**: Lock-wait boundary condition verified — client waiting on row lock captures post-lock clock_timestamp(), correctly evaluating window expiry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Durable Wallet Ownership, Retrieval & Single-Owner Authorization (H133-01 to H133-12)" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-01 / H133-02**: Claimed credential retrievable after memory wipe; independent Prisma clients retrieve identical state" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-03 / H133-04**: Strict user isolation verified; unclaimed invitations and foreign tenant records excluded" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-05 / H133-06**: Exact credential identifier and certificate-number ownership succeeds; mismatches strictly fail" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-07**: Empty in-memory wallet cannot bypass presentation ownership check" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-08**: Single-owner invariant enforced: concurrent redemption races for same credential allow exactly one winner (200) and reject loser with typed CREDENTIAL_ALREADY_CLAIMED (409)" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-09**: GET wallet API strictly scopes to authenticated session.sub and ignores caller-supplied query parameters" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-10**: Presentation endpoint rejects foreign, unclaimed, or mixed credentials before verification; challenge nonce remains unconsumed" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-11**: Legitimate claimant retrieves and authorizes presentation after cache wipe; challenge nonce consumed atomically" >> $GITHUB_STEP_SUMMARY
          echo "- **H133-12**: Database outage produces sanitized HTTP 503 WALLET_STORAGE_UNAVAILABLE behavior without burning nonces" >> $GITHUB_STEP_SUMMARY
